name: Security check - Go Sec

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - staging
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    golang-security-action:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: ynniss/golang-security-action@master
              continue-on-error: true